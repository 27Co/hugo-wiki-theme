{{ define "main" }}
<div class="homepage-layout">
  <aside class="sidebar">
    <img src="/{{ .Params.photo }}" alt="{{ .Params.name }}" class="profile-pic">
    <h2>{{ .Params.name }}</h2>
    <p class="subtitle">{{ .Params.role }}<br>{{ .Params.affiliation }}</p>
    <ul class="contact-links">
      <li>{{ .Params.location }}</li>
      <li><a href="mailto:{{ .Params.email }}">Email</a></li>
      <li><a href="https://github.com/{{ .Params.github }}">GitHub</a></li>
      <li><a href="https://scholar.google.com/citations?user={{ .Params.scholar }}">Google Scholar</a></li>
      <li><a href="https://www.linkedin.com/in/{{ .Params.linkedin }}">LinkedIn</a></li>
    </ul>
  </aside>
  <section class="main-content">
    {{ .Content }}
    <!--
    {{ range site.RegularPages }}
      <section>
        <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        {{ .Summary }}
      </section>
    {{ end }}
    -->
  </section>
</div>
{{ end }}
